name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        # macOS runs every time because tick schedules itself with launchd there
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: go vet
        if: runner.os == 'Linux'
        run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        if: runner.os == 'Linux'
        with:
          version: v2.14
      - name: go test
        run: go test -race -coverprofile=cover.out ./...
      - name: Coverage summary
        if: runner.os == 'Linux'
        run: |
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=cover.out | tail -n 25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

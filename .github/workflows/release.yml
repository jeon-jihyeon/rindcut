name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/test.yml

  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    # Write access stays on the one job that publishes
    permissions:
      contents: write
      # Signs the build provenance through the GitHub OIDC token
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
      - name: Check release version
        run: jq -e --arg tag "$RELEASE_TAG" '.version | type == "string" and length > 0 and ("v" + . == $tag)' plugin/.claude-plugin/plugin.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Install verified GoReleaser
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/rindcut-goreleaser"
          mkdir "$tool_dir"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 120 --output "$tool_dir/archive.tar.gz" https://github.com/goreleaser/goreleaser/releases/download/v2.19.0/goreleaser_Linux_x86_64.tar.gz
          printf '%s  %s\n' ebc3194ad1d1b1787614405285a0039665cd4c5bd3305215a1b201600f90630b "$tool_dir/archive.tar.gz" | sha256sum --check --strict
          mkdir "$tool_dir/bin"
          tar -xzf "$tool_dir/archive.tar.gz" -C "$tool_dir/bin" -- goreleaser
          printf '%s  %s\n' 98faab71b8d945309844bd508e7d075170f60ba1126afa9f73fa69f46c28877a "$tool_dir/bin/goreleaser" | sha256sum --check --strict
      # Publishes a draft so the release appears only once every archive is uploaded and attested
      - name: Build the draft release
        run: '"$RUNNER_TEMP/rindcut-goreleaser/bin/goreleaser" release --clean'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      # Repository build provenance attached to each release archive
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
      - name: Publish the release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
